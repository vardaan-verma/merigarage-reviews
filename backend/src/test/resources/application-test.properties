# Test profile — datasource configuration for integration tests.
# Reads the same environment variables as production so no separate credentials file is needed.
# DB_PASSWORD must be set in the environment; there is intentionally no default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/merigarage}
spring.datasource.username=${DB_USERNAME:merigarage_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway runs its migrations during tests so the schema is always up-to-date.
spring.flyway.enabled=true

# Hibernate strict schema validation: validates entity mappings against actual MySQL schema
spring.jpa.hibernate.ddl-auto=validate

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:System Administrator}

