spring.application.name=merigarage-reviews-backend

# ─── DataSource ───────────────────────────────────────────────────────────────
# Credentials are supplied via environment variables.
# DB_PASSWORD has no default — the application will refuse to start if it is missing.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/merigarage}
spring.datasource.username=${DB_USERNAME:merigarage_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── HikariCP connection pool ─────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=MeriGaragePool

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# DDL is managed by Flyway only. 'none' prevents Hibernate from touching the schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ─── Admin Bootstrap ──────────────────────────────────────────────────────────
# Read from environment variables if provided. Left empty by default.
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:System Administrator}

